name: Build Android APK
on:
  workflow_dispatch:
  push:
    # main = public release (qa-latest); beta = owner test builds (beta-latest)
    branches: [main, beta]
  pull_request:
    branches: [main]

# Prevent an older main build from publishing over a newer QA APK.
concurrency:
  group: senreader-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50's Android template breaks file_picker/permission
          # handling on AGP 9; 3.47.9 is the verified release toolchain.
          flutter-version: 3.47.9
          cache: true
      - name: Verify protected signing wrapper preparation
        run: python3 scripts/test_prepare_android.py
      - name: Verify old debug library export parser
        run: python3 scripts/test_export_installed_debug_library.py
      - name: Check local signing helper syntax without using secrets
        shell: pwsh
        run: ./scripts/test_setup_stable_signing.ps1
      - name: Generate Android wrapper
        run: |
          flutter create --project-name senreader --org app.senreader --platforms android .
          rm -f test/widget_test.dart
      - name: Configure stable signing from GitHub Secrets (main only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SIGNING_KEY: ${{ secrets.SENREADER_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SENREADER_SIGNING_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SENREADER_SIGNING_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SENREADER_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SIGNING_KEY" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/senreader-upload.jks
            chmod 600 android/app/senreader-upload.jks
            {
              printf 'storeFile=senreader-upload.jks\n'
              printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$SIGNING_ALIAS"
              printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
            } > android/key.properties
            chmod 600 android/key.properties
            echo 'SENREADER_STABLE_SIGNING=true' >> "$GITHUB_ENV"
            echo 'Protected release signing enabled for main.'
          elif [[ -n "$SIGNING_KEY" || -n "$SIGNING_STORE_PASSWORD" || -n "$SIGNING_ALIAS" || -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo 'Incomplete protected signing secrets: refusing an unsigned release.' >&2
            exit 1
          else
            echo 'Stable signing is not configured. Using an ephemeral debug APK.'
          fi
      - name: Prepare Android manifest and signing
        run: python3 scripts/prepare_android.py
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Configure optional Firebase client identifiers
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.SENREADER_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.SENREADER_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.SENREADER_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.SENREADER_FIREBASE_SENDER_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.SENREADER_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          echo '{}' > firebase-build-flags.json
          if [[ -n "$FIREBASE_API_KEY" && -n "$FIREBASE_APP_ID" && -n "$FIREBASE_PROJECT_ID" && -n "$FIREBASE_SENDER_ID" ]]; then
            python3 - <<'PY'
          import json, os
          names = ['FIREBASE_API_KEY', 'FIREBASE_APP_ID', 'FIREBASE_PROJECT_ID', 'FIREBASE_SENDER_ID', 'GOOGLE_WEB_CLIENT_ID']
          data = {'SENREADER_' + key: os.environ.get(key, '') for key in names[:4]}
          data['SENREADER_GOOGLE_WEB_CLIENT_ID'] = os.environ.get('GOOGLE_WEB_CLIENT_ID', '')
          with open('firebase-build-flags.json', 'w') as stream:
              json.dump(data, stream)
          PY
          elif [[ -n "$FIREBASE_API_KEY" || -n "$FIREBASE_APP_ID" || -n "$FIREBASE_PROJECT_ID" || -n "$FIREBASE_SENDER_ID" ]]; then
            echo 'Partial Firebase configuration: refusing partial cloud mode.' >&2
            exit 1
          fi
      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=firebase-build-flags.json
  # main and beta only, after successful read-only test/build verification.
  # No Actions artifacts: publish a signed APK directly to GitHub Releases,
  # even when the temporary Actions artifact storage quota is exhausted.
  publish-direct-apk:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50's Android template breaks file_picker/permission
          # handling on AGP 9; 3.47.9 is the verified release toolchain.
          flutter-version: 3.47.9
          cache: true
      - name: Generate Android wrapper
        run: |
          flutter create --project-name senreader --org app.senreader --platforms android .
          rm -f test/widget_test.dart
      - name: Require existing persistent release signing
        env:
          SIGNING_KEY: ${{ secrets.SENREADER_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SENREADER_SIGNING_STORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SENREADER_SIGNING_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SENREADER_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_ALIAS" || -z "$SIGNING_KEY_PASSWORD" ]]; then
            echo 'Persistent signing secrets are not configured; refusing an incompatible APK.' >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/senreader-upload.jks
          chmod 600 android/app/senreader-upload.jks
          {
            printf 'storeFile=senreader-upload.jks\n'
            printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SIGNING_ALIAS"
            printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Prepare Android manifest and signing
        run: python3 scripts/prepare_android.py
      - name: Install packages
        run: flutter pub get
      - name: Configure optional Firebase client identifiers
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ vars.SENREADER_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.SENREADER_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.SENREADER_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.SENREADER_FIREBASE_SENDER_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.SENREADER_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          echo '{}' > firebase-build-flags.json
          if [[ -n "$FIREBASE_API_KEY" && -n "$FIREBASE_APP_ID" && -n "$FIREBASE_PROJECT_ID" && -n "$FIREBASE_SENDER_ID" ]]; then
            python3 - <<'PY'
          import json, os
          names = ['FIREBASE_API_KEY', 'FIREBASE_APP_ID', 'FIREBASE_PROJECT_ID', 'FIREBASE_SENDER_ID', 'GOOGLE_WEB_CLIENT_ID']
          data = {'SENREADER_' + key: os.environ.get(key, '') for key in names[:4]}
          data['SENREADER_GOOGLE_WEB_CLIENT_ID'] = os.environ.get('GOOGLE_WEB_CLIENT_ID', '')
          with open('firebase-build-flags.json', 'w') as stream:
              json.dump(data, stream)
          PY
          elif [[ -n "$FIREBASE_API_KEY" || -n "$FIREBASE_APP_ID" || -n "$FIREBASE_PROJECT_ID" || -n "$FIREBASE_SENDER_ID" ]]; then
            echo 'Partial Firebase configuration: refusing partial cloud mode.' >&2
            exit 1
          fi
      - name: Build signed release APK
        # +1000 keeps CI versionCodes above all earlier local builds (≤ 999),
        # so every signed CI APK installs over the previous one.
        run: flutter build apk --release --build-number "$((GITHUB_RUN_NUMBER + 1000))" --dart-define-from-file=firebase-build-flags.json
      - name: Publish signed APK directly (without Actions artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          version="$((GITHUB_RUN_NUMBER + 1000))"
          if [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            tag=beta-latest
            file=SenReader-beta.apk
            title="SenReader — бета для проверки"
            notes="Тестовая сборка ветки beta, версия $version, commit $GITHUB_SHA. Может быть нестабильной. Ставьте поверх установленной версии; перед обновлением сохраните резервную копию библиотеки."
          else
            tag=qa-latest
            file=SenReader-latest.apk
            title="SenReader — последняя версия"
            notes="Подписанная сборка main, версия $version, commit $GITHUB_SHA. Скачайте SenReader-latest.apk и установите поверх предыдущей версии. Не удаляйте установленную версию: вместе с ней удалятся закладки и прогресс."
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$file"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" "$file" --clobber
          gh release edit "$tag" --title "$title" --notes "$notes"
