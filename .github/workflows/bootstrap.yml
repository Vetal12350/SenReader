name: Import SenReader and build APK
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and unpack SenReader source archive
        shell: bash
        run: |
          set -euo pipefail
          cat _payload/part0* | base64 --decode > /tmp/senreader-src.tar.xz
          echo '1d2062f3d75d5255a061c083fcfce5824c2e0ccf0dfd08ec01c8d8e9fa1cd747  /tmp/senreader-src.tar.xz' | sha256sum --check
          tar -xJf /tmp/senreader-src.tar.xz
          test -f lib/main.dart
          test -f pubspec.yaml
          test -f .github/workflows/android-apk.yml
          echo 'Verified and unpacked source files'

      - name: Commit source files to repository
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md pubspec.yaml analysis_options.yaml .gitignore lib test scripts .github/workflows/android-apk.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Import SenReader v0.1 application source'
            git push origin HEAD:main
          fi

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --project-name senreader --org app.senreader --platforms android .
          python3 scripts/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SenReader-v0.1-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
