name: senreader
description: Personal Android manga and manhwa reader with Senkuro, ReadManga and ReManga sources.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  http: ^1.3.0
  html: ^0.15.5
  shared_preferences: ^2.3.3
  scrollable_positioned_list: ^0.3.8
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.1.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

